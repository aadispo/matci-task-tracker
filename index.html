
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Task Tracker</title>

<style>
:root {
  --navy: #12243a;
  --blue: #245b8f;
  --light: #f3f6fa;
  --border: #dce3eb;
  --text: #243447;
  --muted: #6b7c90;
  --red: #d64545;
  --green: #22845b;
  --orange: #dd8b27;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px;
  background: var(--light);
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
}

.container {
  max-width: 1150px;
  margin: auto;
}

header {
  background: var(--navy);
  color: white;
  padding: 26px;
  border-radius: 14px;
  margin-bottom: 20px;
}

header h1 {
  margin: 0 0 8px;
  font-size: 30px;
}

header p {
  margin: 0;
  opacity: .85;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 20px 0;
}

.week-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

button {
  border: 0;
  padding: 11px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  background: var(--blue);
  color: white;
}

button:hover {
  opacity: .9;
}

button.secondary {
  background: #e1e8f0;
  color: var(--text);
}

button.danger {
  background: #fee2e2;
  color: #a12323;
}

button.small {
  padding: 7px 10px;
  font-size: 12px;
}

.week-label {
  font-weight: bold;
  min-width: 190px;
  text-align: center;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}

.stat {
  background: white;
  border: 1px solid var(--border);
  padding: 16px;
  border-radius: 12px;
}

.stat .number {
  font-size: 25px;
  font-weight: bold;
  margin-top: 5px;
}

.stat .label {
  color: var(--muted);
  font-size: 13px;
}

.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 16px 0;
}

.toolbar input,
.toolbar select {
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: white;
}

#taskList {
  display: grid;
  gap: 12px;
}

.task {
  background: white;
  border: 1px solid var(--border);
  border-left: 5px solid var(--blue);
  border-radius: 12px;
  padding: 17px;
}

.task.overdue {
  border-left-color: var(--red);
}

.task.completed {
  border-left-color: var(--green);
  opacity: .85;
}

.task-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}

.task-title {
  font-size: 18px;
  font-weight: bold;
  word-break: break-word;
}

.task-description {
  white-space: pre-wrap;
  margin: 10px 0;
  color: #526478;
}

.meta {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 12px 0;
}

.badge {
  font-size: 12px;
  font-weight: bold;
  padding: 5px 9px;
  border-radius: 20px;
  background: #eaf0f6;
}

.priority-high {
  background: #fee2e2;
  color: #a12323;
}

.priority-medium {
  background: #fff1d6;
  color: #9b6200;
}

.priority-low {
  background: #e4f5ea;
  color: #237047;
}

.status-pending {
  background: #e8eef7;
  color: #365b88;
}

.status-progress {
  background: #fff1d6;
  color: #9b6200;
}

.status-completed {
  background: #e4f5ea;
  color: #237047;
}

.deadline-text {
  font-weight: bold;
}

.overdue-text {
  color: var(--red);
}

.remarks {
  background: #f7f9fc;
  padding: 12px;
  border-radius: 8px;
  margin-top: 12px;
}

.remarks-title {
  font-weight: bold;
  font-size: 13px;
  margin-bottom: 8px;
}

.remark-item {
  padding: 8px 0;
  border-top: 1px solid #e3e9f0;
  font-size: 13px;
  white-space: pre-wrap;
}

.remark-date {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 3px;
}

.task-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.empty {
  text-align: center;
  padding: 40px;
  background: white;
  border: 1px dashed var(--border);
  border-radius: 12px;
  color: var(--muted);
}

dialog {
  border: none;
  border-radius: 14px;
  padding: 0;
  width: min(550px, 95vw);
  box-shadow: 0 10px 40px rgba(0,0,0,.2);
}

dialog::backdrop {
  background: rgba(0,0,0,.45);
}

.form {
  padding: 22px;
}

.form h2 {
  margin-top: 0;
}

.form label {
  display: block;
  font-weight: bold;
  margin: 12px 0 6px;
  font-size: 13px;
}

.form input,
.form select,
.form textarea {
  width: 100%;
  padding: 11px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font: inherit;
}

.form textarea {
  resize: vertical;
  min-height: 85px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
}

.required-note {
  font-size: 12px;
  color: var(--muted);
}

.footer {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  padding: 25px;
}

@media (max-width: 700px) {
  body {
    padding: 12px;
  }

  header h1 {
    font-size: 24px;
  }

  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .form-row {
    grid-template-columns: 1fr;
  }

  .task-header {
    flex-direction: column;
  }
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>Weekly Task</h1>
  <p>MATCI • Weekly Task Monitoring & Follow-Up</p>
</header>

<div class="topbar">
  <div class="week-controls">
    <button class="secondary" onclick="changeWeek(-1)">◀ Previous</button>
    <div class="week-label" id="weekLabel"></div>
    <button class="secondary" onclick="changeWeek(1)">Next ▶</button>
    <button class="secondary" onclick="goCurrentWeek()">This Week</button>
  </div>

  <button onclick="openNewTask()">+ Add New Task</button>
</div>

<div class="stats">
  <div class="stat">
    <div class="label">TOTAL TASKS</div>
    <div class="number" id="totalCount">0</div>
  </div>
  <div class="stat">
    <div class="label">PENDING</div>
    <div class="number" id="pendingCount">0</div>
  </div>
  <div class="stat">
    <div class="label">IN PROGRESS</div>
    <div class="number" id="progressCount">0</div>
  </div>
  <div class="stat">
    <div class="label">COMPLETED</div>
    <div class="number" id="completedCount">0</div>
  </div>
</div>

<div class="toolbar">
  <input id="searchInput" type="search" placeholder="Search tasks..." oninput="render()">
  <select id="statusFilter" onchange="render()">
    <option value="All">All Statuses</option>
    <option value="Pending">Pending</option>
    <option value="In Progress">In Progress</option>
    <option value="Completed">Completed</option>
  </select>
  <select id="priorityFilter" onchange="render()">
    <option value="All">All Priorities</option>
    <option value="High">High Priority</option>
    <option value="Medium">Medium Priority</option>
    <option value="Low">Low Priority</option>
  </select>
</div>

<div id="taskList"></div>

<div class="footer">
  MATCI Weekly Task Tracker
</div>

</div>

<!-- ADD / EDIT TASK FORM -->
<dialog id="taskDialog">
  <form class="form" id="taskForm" onsubmit="saveTask(event)">
    <h2 id="dialogTitle">Add New Task</h2>

    <input type="hidden" id="taskId">

    <label for="taskTitle">Task Title *</label>
    <input id="taskTitle" required maxlength="150" placeholder="Enter task title">

    <label for="taskDescription">Description / Details</label>
    <textarea id="taskDescription" placeholder="Enter details about the task..."></textarea>

    <div class="form-row">
      <div>
        <label for="startDate">Start Date</label>
        <input type="date" id="startDate">
      </div>
      <div>
        <label for="deadline">Deadline * (Required)</label>
        <input type="date" id="deadline" required>
      </div>
    </div>

    <div class="form-row">
      <div>
        <label for="priority">Priority</label>
        <select id="priority">
          <option value="Medium">Medium</option>
          <option value="High">High</option>
          <option value="Low">Low</option>
        </select>
      </div>
      <div>
        <label for="status">Status</label>
        <select id="status">
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
    </div>

    <p class="required-note">* Required fields. A task cannot be saved without a deadline.</p>

    <div class="form-actions">
      <button type="button" class="secondary" onclick="closeDialog()">Cancel</button>
      <button type="submit">Save Task</button>
    </div>
  </form>
</dialog>

<!-- ADD REMARK FORM -->
<dialog id="remarkDialog">
  <form class="form" id="remarkForm" onsubmit="saveRemark(event)">
    <h2>Add Remark / Update</h2>
    <input type="hidden" id="remarkTaskId">

    <label for="remarkText">New Remark *</label>
    <textarea id="remarkText" required placeholder="Enter update, follow-up, or new information..."></textarea>

    <div class="form-actions">
      <button type="button" class="secondary" onclick="remarkDialog.close()">Cancel</button>
      <button type="submit">Save Remark</button>
    </div>
  </form>
</dialog>

<script>
const STORAGE_KEY = "matci_weekly_task_tracker_v2";

let tasks = [];
let selectedWeek = new Date();

function loadTasks() {
  try {
    tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch {
    tasks = [];
  }
}

function saveTasks() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
}

function dateOnly(date) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate());
}

function toISODate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function mondayOf(date) {
  const d = dateOnly(date);
  const day = d.getDay();
  d.setDate(d.getDate() - ((day + 6) % 7));
  return d;
}

function sundayOf(date) {
  const d = mondayOf(date);
  d.setDate(d.getDate() + 6);
  return d;
}

function formatDate(dateString) {
  if (!dateString) return "Not set";
  const d = new Date(dateString + "T00:00:00");
  return d.toLocaleDateString(undefined, {
    month: "short",
    day: "numeric",
    year: "numeric"
  });
}

function formatWeek(date) {
  const start = mondayOf(date);
  const end = sundayOf(date);
  const options = { month: "short", day: "numeric" };
  return `${start.toLocaleDateString(undefined, options)} – ${end.toLocaleDateString(undefined, options)}, ${end.getFullYear()}`;
}

function changeWeek(direction) {
  selectedWeek.setDate(selectedWeek.getDate() + direction * 7);
  render();
}

function goCurrentWeek() {
  selectedWeek = new Date();
  render();
}

function openNewTask() {
  taskForm.reset();
  taskId.value = "";
  startDate.value = toISODate(new Date());
  deadline.value = "";
  priority.value = "Medium";
  status.value = "Pending";
  dialogTitle.textContent = "Add New Task";
  taskDialog.showModal();
}

function closeDialog() {
  taskDialog.close();
}

function saveTask(event) {
  event.preventDefault();

  const title = taskTitle.value.trim();
  const due = deadline.value;

  if (!title || !due) {
    alert("Please enter a task title and deadline.");
    return;
  }

  const id = taskId.value;

  if (id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;

    task.title = title;
    task.description = taskDescription.value.trim();
    task.startDate = startDate.value;
    task.deadline = due;
    task.priority = priority.value;
    task.status = status.value;
    task.updatedAt = new Date().toISOString();
  } else {
    tasks.push({
      id: crypto.randomUUID(),
      title,
      description: taskDescription.value.trim(),
      startDate: startDate.value,
      deadline: due,
      priority: priority.value,
      status: status.value,
      remarks: [],
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    });
  }

  saveTasks();
  taskDialog.close();
  render();
}

function editTask(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;

  taskId.value = task.id;
  taskTitle.value = task.title;
  taskDescription.value = task.description || "";
  startDate.value = task.startDate || "";
  deadline.value = task.deadline || "";
  priority.value = task.priority || "Medium";
  status.value = task.status || "Pending";

  dialogTitle.textContent = "Edit Task";
  taskDialog.showModal();
}

function deleteTask(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;

  if (!confirm(`Delete this task?\n\n${task.title}`)) return;

  tasks = tasks.filter(t => t.id !== id);
  saveTasks();
  render();
}

function quickStatus(id, newStatus) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;

  task.status = newStatus;
  task.updatedAt = new Date().toISOString();
  saveTasks();
  render();
}

function openRemark(id) {
  remarkTaskId.value = id;
  remarkText.value = "";
  remarkDialog.showModal();
}

function saveRemark(event) {
  event.preventDefault();

  const id = remarkTaskId.value;
  const text = remarkText.value.trim();
  if (!text) return;

  const task = tasks.find(t => t.id === id);
  if (!task) return;

  if (!task.remarks) task.remarks = [];

  task.remarks.unshift({
    text,
    date: new Date().toISOString()
  });

  task.updatedAt = new Date().toISOString();

  saveTasks();
  remarkDialog.close();
  render();
}

function isOverdue(task) {
  if (!task.deadline || task.status === "Completed") return false;
  const today = toISODate(new Date());
  return task.deadline < today;
}

function getWeekTasks() {
  const start = toISODate(mondayOf(selectedWeek));
  const end = toISODate(sundayOf(selectedWeek));

  return tasks.filter(task => {
    // Show tasks whose deadlines fall in the selected week
    return task.deadline && task.deadline >= start && task.deadline <= end;
  });
}

function render() {
  document.getElementById("weekLabel").textContent = formatWeek(selectedWeek);

  const weekTasks = getWeekTasks();
  const search = document.getElementById("searchInput").value.toLowerCase();
  const statusValue = document.getElementById("statusFilter").value;
  const priorityValue = document.getElementById("priorityFilter").value;

  const filtered = weekTasks.filter(task => {
    const matchesSearch =
      task.title.toLowerCase().includes(search) ||
      (task.description || "").toLowerCase().includes(search) ||
      (task.remarks || []).some(r => r.text.toLowerCase().includes(search));

    const matchesStatus = statusValue === "All" || task.status === statusValue;
    const matchesPriority = priorityValue === "All" || task.priority === priorityValue;

    return matchesSearch && matchesStatus && matchesPriority;
  });

  document.getElementById("totalCount").textContent = weekTasks.length;
  document.getElementById("pendingCount").textContent =
    weekTasks.filter(t => t.status === "Pending").length;
  document.getElementById("progressCount").textContent =
    weekTasks.filter(t => t.status === "In Progress").length;
  document.getElementById("completedCount").textContent =
    weekTasks.filter(t => t.status === "Completed").length;

  const list = document.getElementById("taskList");

  if (!filtered.length) {
    list.innerHTML = `<div class="empty">
      <h3>No tasks due this week</h3>
      <p>Add a task and set its deadline to this week to see it here.</p>
    </div>`;
    return;
  }

  filtered.sort((a, b) => {
    if (a.status === "Completed" && b.status !== "Completed") return 1;
    if (b.status === "Completed" && a.status !== "Completed") return -1;
    return a.deadline.localeCompare(b.deadline);
  });

  list.innerHTML = filtered.map(task => {
    const overdue = isOverdue(task);
    const remarks = task.remarks || [];

    const priorityClass = "priority-" + (task.priority || "Medium").toLowerCase();
    const statusClass = task.status === "Completed"
      ? "status-completed"
      : task.status === "In Progress"
      ? "status-progress"
      : "status-pending";

    return `
      <div class="task ${overdue ? "overdue" : ""} ${task.status === "Completed" ? "completed" : ""}">
        <div class="task-header">
          <div class="task-title">${escapeHTML(task.title)}</div>
          ${overdue ? `<span class="badge overdue-text">OVERDUE</span>` : ""}
        </div>

        ${task.description ? `<div class="task-description">${escapeHTML(task.description)}</div>` : ""}

        <div class="meta">
          <span class="badge ${priorityClass}">${escapeHTML(task.priority || "Medium")} Priority</span>
          <span class="badge ${statusClass}">${escapeHTML(task.status || "Pending")}</span>
          <span class="badge deadline-text ${overdue ? "overdue-text" : ""}">
            Deadline: ${formatDate(task.deadline)}
          </span>
          ${task.startDate ? `<span class="badge">Start: ${formatDate(task.startDate)}</span>` : ""}
        </div>

        ${remarks.length ? `
          <div class="remarks">
            <div class="remarks-title">Remarks & Updates (${remarks.length})</div>
            ${remarks.map(r => `
              <div class="remark-item">
                <div class="remark-date">${new Date(r.date).toLocaleString()}</div>
                ${escapeHTML(r.text)}
              </div>
            `).join("")}
          </div>
        ` : ""}

        <div class="task-actions">
          <button class="small" onclick="openRemark('${task.id}')">+ Add Remark</button>
          <button class="small secondary" onclick="editTask('${task.id}')">Edit Task</button>
          <select class="small" onchange="quickStatus('${task.id}', this.value)">
            <option ${task.status === "Pending" ? "selected" : ""} value="Pending">Pending</option>
            <option ${task.status === "In Progress" ? "selected" : ""} value="In Progress">In Progress</option>
            <option ${task.status === "Completed" ? "selected" : ""} value="Completed">Completed</option>
          </select>
          <button class="small danger" onclick="deleteTask('${task.id}')">Delete</button>
        </div>
      </div>
    `;
  }).join("");
}

function escapeHTML(text) {
  return String(text ?? "").replace(/[&<>"']/g, function(char) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char];
  });
}

// Initialize
loadTasks();
render();
</script>

</body>
</html>
